services:

  db:
    image: postgres:16-alpine
    container_name: prodassist-db

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-prodassist}
      POSTGRES_USER: ${POSTGRES_USER:-prodassist}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prodassist_dev_password}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-prodassist} -d ${POSTGRES_DB:-prodassist}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: prodassist-backend

    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://prodassist:prodassist_dev_password@db:5432/prodassist}

    ports:
      - "${BACKEND_PORT:-8000}:8000"

    depends_on:
      db:
        condition: service_healthy

    volumes:
      - ./data:/app/data:ro

    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: prodassist-frontend

    ports:
      - "${FRONTEND_PORT:-5173}:80"

    depends_on:
      - backend

    restart: unless-stopped

volumes:
  postgres_data:
